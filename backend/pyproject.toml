[project]
name = "generative-code-retrieval-backend"
version = "0.1.0"
description = "Offline Python Ingestion and Retrieval Backend for Generative Code Retrieval Search Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.23.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "sentence-transformers>=3.0.0",
    "lancedb>=0.10.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["app/tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

